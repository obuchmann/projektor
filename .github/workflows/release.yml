name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without leading v, e.g. 0.2.0-rc.1)"
        required: true
        default: "0.2.0-rc.1"

permissions:
  contents: write

jobs:
  build:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ matrix.os }}-

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

      - name: Publish self-contained
        shell: bash
        run: >
          dotnet publish src/Projektor.App/Projektor.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          name="projektor-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          (cd publish/${{ matrix.rid }} && 7z a -tzip "../../dist/${name}.zip" .)

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          name="projektor-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C "publish/${{ matrix.rid }}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: projektor-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Resolve the release tag and (for manual runs) the commit to tag.
          target_args=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${{ github.event.inputs.version }}"
            target_args=(--target "${GITHUB_SHA}")
          fi

          # Semver pre-release tags carry a hyphen suffix (e.g. v0.2.0-rc.1).
          pre_args=()
          if [[ "${tag}" == *-* ]]; then
            pre_args=(--prerelease)
            echo "Tag ${tag} -> pre-release"
          else
            echo "Tag ${tag} -> full release"
          fi

          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${tag}" \
            --generate-notes \
            "${pre_args[@]}" \
            "${target_args[@]}" \
            artifacts/*
